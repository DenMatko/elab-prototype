<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>e.Lab — lesson prototype</title>
<meta name="description" content="Interactive prototype of a student lesson in the e.Lab learning platform: topics, practice with instant feedback and a final test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap">
<style>
:root{--primary:#297251;--primary-hover:#215B43;--primary-light:#F0F9F4;--nav:#1E293B;--nav-active:#334155;--accent:#FF9800;--card:#fff;--page:#F8FAFC;--highlight:#F0F7F3;--muted:#E2E8F0;--t1:#1E293B;--t2:#475569;--t3:#64748B;--t-dis:#94A3B8;--stroke:#E2E8F0;--stroke-strong:#CBD5E1;--brand-tint:#CFE5D8;--success:#22C55E;--success-light:#F0FDF4;--danger:#F43F5E;--danger-light:#FFF1F2;--shadow:0 2px 4px rgba(15,23,42,.06),0 4px 8px rgba(15,23,42,.10)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t1);background:#fff;-webkit-font-smoothing:antialiased;font-size:16px;line-height:22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--t2);outline-offset:2px}
svg{display:block;flex:none}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:312px;flex:none;background:var(--nav);color:#fff;padding:32px 16px;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:0;height:100vh}
.logo{display:block;height:32px}
.nav{display:flex;flex-direction:column;gap:8px;margin-top:32px}
.nav button{display:flex;align-items:center;gap:8px;height:48px;padding:10px 12px;border-radius:999px;font-weight:700;color:#fff;width:100%}
.nav button svg{color:#86C5A4}
.nav button:hover{background:rgba(51,65,85,.6)}
.nav button.on{background:var(--nav-active)}
.acct{border-top:1px solid var(--t2);padding-top:24px;display:flex;align-items:center;gap:16px}
.ava{width:40px;height:40px;border-radius:50%;background:var(--brand-tint);color:var(--primary-hover);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.acct b{display:block;font-weight:700}.acct span{color:var(--muted);font-weight:500}
.acct .out{margin-left:auto;width:48px;height:48px;display:grid;place-items:center;border-radius:6px}
.acct .out:hover{background:var(--nav-active)}
.topbar{display:none}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.head{background:var(--page);border-bottom:1px solid var(--stroke);padding:32px;display:flex;flex-direction:column;gap:16px}
.link{display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:700;color:var(--t2);align-self:flex-start}
.link:hover{color:var(--t1)}
.head-row{display:flex;align-items:center;gap:16px;justify-content:space-between}
h1{margin:0;font-size:30px;line-height:38px;font-weight:800;letter-spacing:-.01em}
.body{padding:32px;display:flex;flex-direction:column;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:10px 16px;border-radius:6px;font-size:14px;line-height:20px;font-weight:700;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn.p{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(15,23,42,.12)}
.btn.p:hover{background:var(--primary-hover)}
.btn.o{background:#fff;border:1px solid var(--stroke-strong);color:var(--t2);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.btn.o:hover{background:var(--page);color:var(--t1)}
.btn.sm{height:32px;padding:6px 12px;border-radius:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--stroke);border-radius:24px;box-shadow:var(--shadow)}
/* course */
.over{padding:24px;display:flex;flex-direction:column;gap:20px}
.over-top{display:flex;gap:24px;align-items:center}
.over-top p{margin:0;flex:1;color:var(--t2);line-height:1.6}
.prog{width:300px;flex:none;display:flex;flex-direction:column;gap:8px}
.prog-l{display:flex;justify-content:space-between;font-size:14px;line-height:20px;font-weight:500;color:var(--t2)}
.prog-l b{color:var(--t1);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{background:var(--page);border-radius:16px;padding:16px;display:flex;gap:12px;min-height:94px}
.tile .ic{width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;flex:none}
.tile small{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--t2)}
.tile b{font-size:14px;line-height:20px;font-weight:700}
.les-h{display:flex;align-items:center;gap:8px;padding:20px 24px;border-bottom:1px solid var(--stroke)}
.les-h h2{margin:0;font-size:18px;line-height:24px;font-weight:700}
.badge{font-size:12px;line-height:16px;font-weight:600;padding:4px 8px;border-radius:99px;background:var(--primary-light);color:var(--primary)}
.row{display:flex;align-items:center;gap:16px;padding:14px 24px;min-height:64px;border-bottom:1px solid var(--stroke)}
.row:last-child{border-bottom:0;border-radius:0 0 24px 24px}
.row .t{flex:1;font-weight:700}
.row .pc{font-size:14px;font-weight:700;color:var(--t2)}
.row .hint{font-size:14px;font-weight:500;color:var(--t-dis)}
.row.cur{background:var(--highlight)}
.row.lock{background:var(--page)}.row.lock .t{color:var(--t-dis)}
.row .st{color:var(--primary)}.row.lock .st{color:var(--t-dis)}
.icon-btn{width:32px;height:32px;border:1px solid var(--stroke-strong);border-radius:4px;display:grid;place-items:center;color:var(--t2)}
.icon-btn:hover{background:var(--page)}
/* lesson */
.lesson{padding:32px;display:flex;flex-direction:column;gap:24px;background:var(--page);flex:1}
.l-title{display:flex;flex-direction:column;gap:8px}
.l-title h1{font-size:24px;line-height:32px}.l-title h1 span{margin-right:10px}
.l-title .sub{font-size:14px;line-height:20px;font-weight:500;color:var(--t2)}
.l-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.l-title-row .note{font-size:14px;font-weight:700;color:var(--t2);padding-top:6px}
.meta{display:flex;justify-content:space-between;gap:16px;font-size:14px;line-height:20px;font-weight:700;color:var(--t2);margin-top:8px}
.meta span{display:inline-flex;align-items:center;gap:6px}.meta .grp{gap:24px}
.stage{border-radius:24px;overflow:hidden;height:clamp(340px,calc(100vh - 372px),580px);position:relative;margin-top:-16px}
.stage.q{background:var(--muted);display:grid;place-items:center;padding:24px}
.l-foot{display:flex;align-items:flex-start;gap:24px}
.l-foot .txt{flex:1;min-width:0}
.l-foot h3{margin:0 0 6px;font-size:18px;line-height:24px;font-weight:700}
.l-foot p{margin:0;font-size:14px;line-height:1.6;font-weight:500;color:var(--t2)}
.l-foot .sp{flex:1}
/* video mock */
.vid{background:radial-gradient(900px 500px at 78% 8%,#24503f 0,rgba(36,80,63,0) 60%),radial-gradient(700px 500px at 8% 100%,#3a2f1a 0,rgba(58,47,26,0) 55%),#0F172A;color:#fff;display:flex;flex-direction:column}
.vid-top{display:flex;align-items:center;gap:8px;padding:24px 32px 0;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#CBD5E1}
.vid-top i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.vid-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:16px 10%;min-height:0}
.who{align-self:flex-start;font-size:12px;line-height:16px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.who.g{background:rgba(255,152,0,.22);color:#FFD08A}
.line-en{font-size:clamp(22px,2.6vw,36px);line-height:1.25;font-weight:700;letter-spacing:-.01em}
.line-uk{font-size:clamp(15px,1.3vw,18px);line-height:1.5;color:#CBD5E1}
.line-en,.line-uk,.who{animation:rise .35s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vid-bot{padding:0 40px 24px}
.seek{display:block;width:100%;height:20px;position:relative}
.seek::before,.seek i{content:"";position:absolute;left:0;top:8px;height:4px;border-radius:9px}
.seek::before{right:0;background:rgba(255,255,255,.25)}.seek i{background:#fff;transition:width .25s linear}
.ctl{display:flex;align-items:center;gap:12px;margin-top:8px}
.ctl button{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:#fff}
.ctl button:hover{background:rgba(255,255,255,.12)}
.ctl .time{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
/* question card */
.qc{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:min(352px,100%)}
.qc h2{margin:0;font-size:18px;line-height:24px;font-weight:700;padding:20px 20px 19px;border-bottom:1px solid var(--stroke)}
.opts{padding:16px;display:flex;flex-direction:column;gap:4px}
.opt{display:flex;align-items:center;gap:10px;min-height:32px;padding:4px 8px 4px 6px;border-radius:99px;width:100%;font-size:14px;line-height:20px;font-weight:700}
button.opt:not(:disabled):hover{background:var(--page)}
.opt:disabled{cursor:default}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--stroke-strong);flex:none;position:relative}
.opt.sel .radio{border-color:var(--t1)}.opt.sel .radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--t1)}
.opt .fb{margin-left:auto;font-weight:500;white-space:nowrap}
.opt.ok{background:var(--primary-light)}.opt.ok .radio{border-color:var(--primary)}.opt.ok .radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--primary)}.opt.ok .fb{color:var(--primary)}
.opt.bad{background:var(--danger-light)}.opt.bad .radio{border-color:var(--danger)}.opt.bad .radio::after{background:var(--danger)}.opt.bad .fb{color:#E11D48}
/* result */
.res{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.res-card{padding:32px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.trophy{width:56px;height:56px;border-radius:50%;background:var(--success-light);color:var(--success);display:grid;place-items:center}
.trophy.f{background:var(--danger-light);color:var(--danger)}
.res-card .cap{color:var(--t2);font-weight:500;margin-top:8px}
.score{font-size:56px;line-height:60px;font-weight:800;letter-spacing:-.02em;margin:-6px 0}
.pass{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--t2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--success-light);color:#16A34A;font-weight:600}
.pill.f{background:var(--danger-light);color:#E11D48}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;text-align:left}
.stat{border-radius:16px;padding:16px 24px;display:flex;align-items:center;gap:20px;background:var(--page)}
.stat.g{background:var(--success-light)}.stat.g svg{color:var(--success)}.stat.r{background:var(--danger-light)}.stat.r svg{color:var(--danger)}.stat svg{color:var(--t2)}
.stat b{display:block;font-size:18px;line-height:24px}.stat span{font-size:14px;line-height:20px;font-weight:500;color:var(--t2)}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.done{background:var(--highlight);border:1px solid var(--brand-tint);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px}
.done-top{display:flex;align-items:center;gap:16px}
.done .chk{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.done .chk.f{background:var(--t3)}
.done b{display:block;font-weight:700}.done small{font-size:14px;line-height:20px;font-weight:500;color:var(--t2)}
.done .txt{flex:1}
/* review */
.rev{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.rev .qc{width:100%;box-shadow:none;border:1px solid var(--stroke)}
.rev .qc h2{display:flex;gap:12px;justify-content:space-between;font-size:16px;line-height:22px}
.rev .tag{font-size:12px;line-height:16px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap;align-self:flex-start}
.tag.g{background:var(--success-light);color:#16A34A}.tag.r{background:var(--danger-light);color:#E11D48}.tag.s{background:var(--muted);color:var(--t2)}
/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(15,23,42,.3);padding:24px;width:min(420px,100%)}
.dlg h2{margin:0 0 8px;font-size:18px;line-height:24px}.dlg p{margin:0 0 20px;color:var(--t2);font-size:14px;line-height:1.6}
.dlg .acts{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--nav);color:#fff;font-size:14px;line-height:20px;font-weight:500;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.m-only{display:none}
@media (max-width:1180px){.side{width:240px}}
@media (max-width:900px){
 .app{flex-direction:column}.side{display:none}
 .topbar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 16px;background:var(--nav);color:#fff;position:sticky;top:0;z-index:10}
 .topbar .logo{height:32px}.topbar button{width:40px;height:40px;display:grid;place-items:center;color:#fff}
 .side.open{display:flex;position:fixed;inset:64px 0 0 0;width:auto;height:auto;z-index:9;padding:16px}
 .side.open .logo{display:none}.side.open .nav{margin-top:0}
 .head{padding:24px 16px 16px;gap:8px;border-bottom:0;background:var(--page)}
 .head .d-only,.d-only{display:none!important}.m-only{display:flex}
 .body{padding:8px 16px 32px;gap:16px;background:var(--page);flex:1}
 .head p.lead{margin:4px 0 0;font-size:14px;line-height:1.6;color:var(--t2)}
 .over{padding:0;border:0;box-shadow:none;background:none;gap:16px}
 .over-top{display:block}.over-top p{display:none}
 .prog{width:auto;background:#fff;border:1px solid var(--stroke);border-radius:24px;box-shadow:var(--shadow);padding:16px;gap:12px}
 .prog .btn{height:48px;font-size:16px;width:100%}
 .tiles{grid-template-columns:1fr;gap:8px}.tile{min-height:0;background:#fff;border:1px solid var(--stroke);padding:12px 16px;align-items:center}.tile .ic{width:32px;height:32px}
 .les-h{padding:20px 16px}.row{padding:14px 16px;gap:12px}.row .hint{display:none}
 .lesson{padding:24px 16px 32px;gap:16px}
 .meta{flex-direction:column;gap:8px;font-size:16px;margin-top:4px}.meta .grp{gap:16px}
 .stage{margin-top:0;height:auto}.stage.vid{aspect-ratio:358/291;min-height:290px}.stage.q{padding:24px 12px;min-height:300px}
 .vid-top{padding:16px 16px 0}.vid-mid{padding:8px 16px;gap:8px}.vid-bot{padding:0 16px 12px}
 .l-foot{flex-direction:column;gap:12px;align-items:stretch}.l-foot .txt{order:-1;margin-bottom:8px}.l-foot h3{font-size:18px}.l-foot p{font-size:16px}
 .l-foot .btn{height:48px;font-size:16px;width:100%}.l-foot .btn.p{order:1}.l-foot .btn.o{order:2}.l-foot .sp{display:none}
 .l-title-row{flex-direction:column;gap:4px}
 .res-card{padding:24px 16px;gap:16px}.stats{grid-template-columns:1fr;gap:8px}.stat{padding:16px 20px}.stat b{display:inline;margin-right:12px}
 .acts{flex-direction:column;width:100%}.acts .btn{height:48px;font-size:16px;width:100%}
 .done{padding:16px}.done-top{flex-wrap:wrap}.done-top .btn{order:5;width:100%;height:48px;font-size:16px}
 .dlg .acts{flex-direction:column-reverse}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>

function go(view){S.view=view;S.menu=false;render()}
function enterStep(i){S.step=i;S.max=Math.max(S.max,i);S.vt=0;S.playing=true;go('lesson')}
function submit(){var c=S.test.filter(function(v,i){return v===TEST[i].a}).length;S.score=Math.round(c/TEST.length*100);if(S.score>=PASS)S.passed=true;S.dlg=false;S.max=STEPS.length;go('result')}
var A={
 nav:function(e,b){if(b.dataset.n==='Courses')go('course');else{S.menu=false;render(true);toast(b.dataset.n+' is not part of this prototype')}},
 na:function(){toast('Not part of this prototype')},
 menu:function(){S.menu=!S.menu;render(true)},
 restart:function(){reset();render();toast('Demo restarted')},
 course:function(){go('course')},
 open:function(){if(S.passed){enterStep(0)}else enterStep(Math.min(S.max,STEPS.length-1))},
 prev:function(){enterStep(S.step-1)},
 next:function(){if(S.step===STEPS.length-1){S.max=STEPS.length;S.ti=0;go('test')}else enterStep(S.step+1)},
 pr:function(e,b){var t=STEPS[S.step].i;if(S.pr[t]!==null)return;S.pr[t]=+b.dataset.i;render(true)},
 ts:function(e,b){S.test[S.ti]=+b.dataset.i;render(true)},
 tprev:function(){S.ti--;render(true)},tnext:function(){S.ti++;render(true)},
 tskip:function(){S.skip[S.ti]=1;S.test[S.ti]=null;S.ti++;render(true)},
 tsubmit:function(){S.dlg=true;render(true);var d=document.querySelector('.dlg .btn.p');if(d)d.focus()},
 dclose:function(e,b){if(b.classList.contains('scrim')&&e.target!==b)return;S.dlg=false;render(true)},
 dsubmit:function(){submit()},
 review:function(){go('review')},result:function(){go('result')},
 retake:function(){S.test=[null,null,null,null,null,null];S.skip={};S.ti=0;go('test')},
 finish:function(){go('course');toast('Lesson 04 completed. Lesson 05 is unlocked')},
 vplay:function(){var d=TOPICS[STEPS[S.step].i].lines.length*LINE;if(S.vt>=d){S.vt=0;S.playing=true}else S.playing=!S.playing;paintVid()},
 vrew:function(){var li=Math.floor(S.vt/LINE);S.vt=((S.vt-li*LINE>1.5)?li:Math.max(0,li-1))*LINE;paintVid()},
 vfwd:function(){var d=TOPICS[STEPS[S.step].i].lines.length*LINE;S.vt=Math.min(d,(Math.floor(S.vt/LINE)+1)*LINE);paintVid()},
 seek:function(e,b){var r=b.getBoundingClientRect(),d=TOPICS[STEPS[S.step].i].lines.length*LINE;S.vt=Math.max(0,Math.min(d,(e.clientX-r.left)/r.width*d));paintVid()}
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var f=A[b.dataset.act];if(f)f(e,b)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(S.dlg){S.dlg=false;render(true)}else if(S.menu){S.menu=false;render(true)}}});
render();
})();
</script>
</body>
</html>
